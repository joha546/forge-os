[project]
name = "forge-mcp"
version = "0.1.0"
description = "FastMCP tool server for forge-os"
requires-python = ">=3.11"
dependencies = [
    "forge-memory",
    "fastmcp>=2.0",
    "feedparser>=6.0",
    "ddgs>=9.0",
    "playwright>=1.49",
    "pyyaml>=6.0",
]

[project.scripts]
forge-mcp = "forge_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge_mcp"]

[tool.uv.sources]
forge-memory = { workspace = true }
