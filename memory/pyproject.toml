[project]
name = "forge-memory"
version = "0.1.0"
description = "SQLite + Chroma memory for forge-os"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge_memory"]
